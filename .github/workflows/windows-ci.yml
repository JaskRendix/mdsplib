name: Windows CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Configure
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_CONFIGURATION }}

    - name: Test
      run: ctest --test-dir build -C ${{ env.BUILD_CONFIGURATION }} --output-on-failure
